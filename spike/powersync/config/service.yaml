# yaml-language-server: $schema=https://unpkg.com/@powersync/service-schema@latest/json-schema/powersync-config.json
# Local development only: no TLS, superuser connection. See ADR-0004.

telemetry:
  disable_telemetry_sharing: true

replication:
  connections:
    - type: postgresql
      uri: !env PS_DATA_SOURCE_URI
      sslmode: disable

storage:
  type: postgresql
  uri: !env PS_STORAGE_SOURCE_URI
  sslmode: disable

port: !env PS_PORT

sync_config:
  path: sync-config.yaml

# Accept the same user tokens Supabase Auth issues. Public keys come from Supabase's
# JWKS endpoint through its API gateway container ("kong") on the Docker network.
client_auth:
  supabase: true
  jwks_uri: http://supabase_kong_relo:8000/auth/v1/.well-known/jwks.json
  audience: ["authenticated"]
