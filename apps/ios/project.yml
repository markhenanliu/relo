# XcodeGen spec. Generate the Xcode project with `make ios-project` (from the repo root).
# The generated Relo.xcodeproj is git-ignored; this file is the source of truth.
name: Relo
options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  RelocKit:
    path: Packages/RelocKit

targets:
  Relo:
    type: application
    platform: iOS
    sources:
      - path: Relo
    dependencies:
      - package: RelocKit
        product: RelocDomain
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Relo
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

schemes:
  Relo:
    build:
      targets:
        Relo: all
    test:
      gatherCoverageData: true
      testPlans: []
    run:
      config: Debug
    archive:
      config: Release
